[package]
name = "rtspcam-pipeline"
description = "RTSP ingest, decoding, scaling and the per-camera frame bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures.workspace = true
openh264 = { workspace = true, optional = true }
rand.workspace = true
retina.workspace = true
rtspcam-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Variant",
] }
windows-core.workspace = true

[features]
default = ["openh264"]
# Software H.264 fallback decoder (Cisco OpenH264, built from source).
openh264 = ["dep:openh264"]

[lints]
workspace = true
