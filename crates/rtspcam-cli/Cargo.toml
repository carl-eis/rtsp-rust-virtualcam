[package]
name = "rtspcam-cli"
description = "Developer tool for RTSP Cam: config inspection, RTSP probing, camera management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
rtspcam-core = { workspace = true, default-features = true }
rtspcam-onvif.workspace = true
rtspcam-ipc = { workspace = true, features = ["server"] }
rtspcam-pipeline.workspace = true
rtspcam-platform.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
rtspcam-vcam-mgr.workspace = true
windows = { workspace = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }
windows-core.workspace = true

[lints]
workspace = true
