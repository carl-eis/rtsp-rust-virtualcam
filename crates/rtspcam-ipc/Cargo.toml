[package]
name = "rtspcam-ipc"
description = "Frame and control protocol between the RTSP Cam app and a virtual camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The async server used by the app. The DLL uses only the protocol and the blocking client.
server = ["dep:tokio", "dep:tracing"]

[dependencies]
rtspcam-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
