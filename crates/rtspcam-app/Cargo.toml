[package]
name = "rtspcam-app"
description = "RTSP Cam desktop app: turns RTSP streams into virtual webcams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "rtspcam_app"
path = "src/lib.rs"

[[bin]]
name = "rtspcam"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rtspcam-core = { workspace = true, default-features = true }
rtspcam-engine.workspace = true
rtspcam-ipc.workspace = true
rtspcam-onvif.workspace = true
rtspcam-pipeline.workspace = true
rtspcam-platform.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
winsafe = { version = "0.0.29", features = ["gui", "shell"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }
windows-core.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
